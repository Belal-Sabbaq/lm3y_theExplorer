DWAPlannerROS:
  # Robot kinematics
  max_vel_x: 0.4
  min_vel_x: 0.0
  max_vel_theta: 1.0
  min_vel_theta: -1.0
  min_in_place_vel_theta: 0.4

  acc_lim_x: 2.0
  acc_lim_theta: 3.2
  acc_lim_y: 0.0

  # Robot is differential drive
  holonomic_robot: false

  # Goal tolerances
  yaw_goal_tolerance: 0.2
  xy_goal_tolerance: 0.10
  latch_xy_goal_tolerance: true

  # Forward simulation
  sim_time: 2.0
  vx_samples: 8
  vtheta_samples: 16
  sim_granularity: 0.025

  # Bias toward forward motion
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.01

  prune_plan: true
