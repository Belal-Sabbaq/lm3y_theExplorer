map_type: costmap


# Either footprint OR robot_radius – pick ONE.
# For a small LIMO-like robot, radius ~0.25 m is common, tune if needed.
transform_tolerance: 0.5

robot_radius: 0.45
# footprint: [[0.20, 0.15], [0.20, -0.15], [-0.20, -0.15], [-0.20, 0.15]]
obstacle_range: 3.0
raytrace_range: 3.5
inflation_radius: 0.55
cost_scaling_factor: 10.0
lethal_cost_threshold: 100

# --- sensor setup ---
observation_sources: laser_scan_sensor

laser_scan_sensor:
  sensor_frame: laser_link
  data_type: LaserScan
  topic: /limo/scan
  marking: true
  clearing: true
  max_obstacle_height: 2.0           
  min_obstacle_height: 0.0